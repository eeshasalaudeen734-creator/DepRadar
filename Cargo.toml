[workspace]
resolver = "2"
members = [
  "contracts/deprader_router",
]

[workspace.dependencies]
soroban-sdk = "22.0.0"

# Root crate: the off-chain side of DepRadar (crawler + scanner modules).
# The on-chain bounty router lives in its own crate under contracts/.
[package]
name = "deprader"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "DepRadar off-chain crawler/scanner toolkit"

[lib]
path = "src/lib.rs"

[features]
# Non-blocking OSV client (`query_osv_async` / `query_osv_batch_async`).
async = []

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
owo-colors = "4"
serde_json = "1"
toml = "1.1.8"
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2"
criterion = { version = "0.5", default-features = false }
jsonschema = { version = "0.26", default-features = false }
mockito = "1"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[[bench]]
name = "typosquat"
harness = false

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
